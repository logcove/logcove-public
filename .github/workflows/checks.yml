name: Build and package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --target "${{ matrix.target }}" -- -D warnings
      - run: cargo test --workspace --locked --target "${{ matrix.target }}"
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Test packaging
        run: python -m unittest discover -s scripts/tests -v
      - name: Package and smoke test extracted CLI
        run: python scripts/release.py cli --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/logcove-*
          if-no-files-found: error
          retention-days: 7

  distribution:
    name: Homebrew and WinGet metadata
    needs: [cli, skill]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: skill
          path: dist
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: python scripts/package_managers.py --assets dist
      - run: python scripts/check_package_managers.py --assets dist
      - name: Check Homebrew formula syntax
        run: |
          LOGCOVE_RELEASE_VERSION=$(python scripts/release.py version)
          python -m zipfile -e "dist/logcove-package-managers-v${LOGCOVE_RELEASE_VERSION}.zip" package-check
          ruby -c package-check/package-managers/Formula/logcove.rb
      - run: python scripts/release.py checksums
      - uses: actions/upload-artifact@v4
        with:
          name: package-managers
          path: |
            dist/logcove-package-managers-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  skill:
    name: Skill and release checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: python scripts/check_skill.py
      - run: python scripts/check_release_workflow.py
      - run: python scripts/release.py skill
      - uses: actions/upload-artifact@v4
        with:
          name: skill
          path: dist/logcove-skills-*.zip
          if-no-files-found: error
          retention-days: 7
