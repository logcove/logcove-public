[package]
name = "logcove"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
description = "Logcove CLI for local log analysis workflows"
license = "Apache-2.0"
repository = "https://github.com/logcove/logcove-public"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
open = "5"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
